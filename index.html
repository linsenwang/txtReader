<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>txtReader</title>
    <link rel="stylesheet" href="lib/katex.min.css">
    <link rel="stylesheet" href="corner-buttons.css">
    <link rel="icon" type="image/x-icon" href="web_icon/yanan.png" />
    <link rel="stylesheet" type="text/css" href="afdian_styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1F2020" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="txtReader">
    <link rel="apple-touch-icon" href="web_icon/yanan_with_border.png">
    <link rel="manifest" href="manifest.json">
    <style>
        @font-face {
            font-family: 'SarasaMonoSC';
            src: local('Sarasa Mono SC'), 
                 local('SarasaMonoSC'),
                 local('Sarasa Mono SC Regular'),
                 url('/fonts/SarasaMonoSC-Regular.ttf') format('truetype');
            font-display: swap;
        }
        
        body {
            font-family: 'SarasaMonoSC', Arial, sans-serif;
            margin: auto;
            padding: 0;
        }

        /* for yanan */
        /* .folder_icon {
            height: 1em;
            width: 1em;
            margin: -0.15em 0.5em;
        } */

        /* for folder */
        .folder_icon {
            height: 1.2em;
            width: 1.2em;
            margin: -0.24em 0.5em;
        }

        .file-list {
            margin: 20px;
            padding: 10px;
        }

        .file-list ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .file-list li {
            margin: 10px 0;
            padding: 10px;
            display: flex;
            flex-direction: column; /* 垂直排列内容 */
            align-items: center; /* 确保子内容在容器中居中 */
            justify-content: center; /* 垂直方向也居中 */
            border-radius: 6px;
            text-align: center; /* 让文本水平居中 */
        }

        .file-list a {
            text-decoration: none;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            word-wrap: break-word; /* 自动换行 */
            overflow-wrap: break-word;
            max-width: 100%; /* 限制宽度，确保适应容器 */
            margin-bottom: 5px; /* 添加与时间的间距 */
            display: block; /* 使链接单独占据一行并居中 */
        }

        .file-list a:hover {
            /* text-decoration: underline; */
            text-decoration: none;
            color: #0056b3; /* 深色悬停效果 */
        }

        .file-list li.visited a {
            color: #888;
        }

        .file-list .read-percent {
            display: none;
        }

        .file-list li:hover .read-percent {
            display: inline;
        }

        .file-list .mtime {
            font-size: 12px;
            color: #555; /* 灰色时间字体 */
            white-space: nowrap; /* 避免时间内容换行 */
            display: block; /* 确保时间单独占据一行并居中 */
        }

        /* 三个角落按钮的定位，外观与交互统一由 corner-buttons.css 提供 */
        #toggleFoldersOnly {
            position: fixed;
            top: var(--corner-btn-inset);
            left: var(--corner-btn-inset);
            z-index: 999;
        }

        #toggleSortMode {
            position: fixed;
            top: var(--corner-btn-inset);
            left: calc(var(--corner-btn-inset) + var(--corner-btn-size) + var(--corner-btn-gap));
            z-index: 999;
        }

        #clipboardMode {
            position: fixed;
            top: var(--corner-btn-inset);
            right: var(--corner-btn-inset);
            z-index: 999;
        }

        .sort-menu {
            position: fixed;
            top: 66px;
            left: 70px;
            z-index: 1000;
            padding: 6px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 10px;
        }

        .sort-menu[hidden] {
            display: none;
        }

        .sort-menu button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #000;
            font-family: inherit;
            font-size: 14px;
            text-align: left;
            white-space: nowrap;
            cursor: pointer;
        }

        .sort-menu button:hover {
            background: rgba(0, 0, 0, 0.06);
        }

        .sort-menu button.active {
            color: #ACBDD0;
            font-weight: bold;
        }

        @media (prefers-color-scheme: dark) {
            .sort-menu {
                background: rgba(40, 40, 40, 0.92);
                border-color: rgba(255, 255, 255, 0.1);
            }

            .sort-menu button {
                color: #fff;
            }

            .sort-menu button:hover {
                background: rgba(255, 255, 255, 0.08);
            }

            .sort-menu button.active {
                color: #ACBDD0;
            }
        }

        /* 临时阅读：右上角角落按钮显示条数，展开列表仍在文件列表上方 */
        #tempReadsToggle {
            position: fixed;
            top: var(--corner-btn-inset);
            right: calc(var(--corner-btn-inset) + var(--corner-btn-size) + var(--corner-btn-gap));
            z-index: 999;
            gap: 2px;
            /* 与角落按钮图标的填充色一致 */
            color: #ACBDD0;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0;
        }

        #tempReadsToggle[hidden] {
            display: none;
        }

        /* 覆盖全局 span { margin: auto }，避免计数和箭头被撑开 */
        #tempReadsToggle span {
            margin: 0;
        }

        #tempReadsToggle .temp-reads-arrow {
            font-size: 9px;
            transition: transform 0.2s ease;
        }

        #tempReadsToggle[aria-expanded="true"] .temp-reads-arrow {
            transform: rotate(180deg);
        }

        .temp-reads {
            margin: 20px 20px 0;
        }

        .temp-reads[hidden] {
            display: none;
        }

        .temp-reads ul {
            list-style: none;
            margin: 0;
            padding: 10px 14px 6px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.03);
        }

        .temp-reads ul[hidden] {
            display: none;
        }

        /* 展开时文件列表紧贴临时阅读条目，去掉顶部间距 */
        .temp-reads.expanded + .file-list {
            margin-top: 0;
            padding-top: 0;
        }

        .temp-reads li {
            padding: 7px 0;
        }

        .temp-reads a {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #000;
            font-size: 15px;
            font-weight: bold;
            line-height: 1.45;
            text-decoration: none;
            overflow-wrap: anywhere;
        }

        .temp-reads a:hover {
            color: #0056b3;
        }

        .temp-reads .meta {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            color: #999;
        }

        /* 最近阅读悬浮条（透明全宽，悬浮在页面最底部） */
        #lastReadBar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #000;
            text-align: center;
        }

        #lastReadBar:hover {
            background: rgba(255, 255, 255, 0.8);
        }


    @media (prefers-color-scheme: dark) {
        .file-list a {
            color: #fff;
        }

        .file-list .mtime {
            color: #aaa;
        }

        .file-list a:hover {
            /* text-decoration: underline; */
            text-decoration: none;
            color: #3388cc; /* 深色悬停效果 */
        }

        .file-list li.visited a {
            color: #888;
        }

        .file-list .read-percent {
            color: #aaa;
        }

        #lastReadBar {
            background: rgba(40, 40, 40, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        #lastReadBar:hover {
            background: rgba(40, 40, 40, 0.85);
        }

        .temp-reads ul {
            background: rgba(255, 255, 255, 0.06);
        }

        .temp-reads a {
            color: #fff;
        }

        .temp-reads a:hover {
            color: #3388cc;
        }

        .temp-reads .meta {
            color: #888;
        }
    }
    </style>
</head>
<body>
    <button id="toggleFoldersOnly" class="corner-btn" title="只显示文件夹" aria-pressed="false"><img src="web_icon/folder.svg"></button>
    <button id="toggleSortMode" class="corner-btn" title="排序方式" aria-haspopup="menu" aria-expanded="false"><img src="web_icon/sort.svg"></button>
    <button id="clipboardMode" class="corner-btn" title="临时阅读剪贴板内容"><img src="web_icon/clipboard.svg"></button>
    <button id="tempReadsToggle" class="corner-btn" title="临时阅读" aria-expanded="false" aria-controls="tempReadsList" hidden><span class="temp-reads-count" id="tempReadsCount"></span><span class="temp-reads-arrow" aria-hidden="true">▾</span></button>
    <div class="sort-menu" id="sortMenu" role="menu" hidden>
        <button type="button" role="menuitemradio" aria-checked="false" data-sort="name-asc">名称正序</button>
        <button type="button" role="menuitemradio" aria-checked="false" data-sort="name-desc">名称倒序</button>
        <button type="button" role="menuitemradio" aria-checked="false" data-sort="time-asc">时间正序</button>
        <button type="button" role="menuitemradio" aria-checked="false" data-sort="time-desc">时间倒序</button>
    </div>
    <!-- 临时阅读列表：默认折叠，展开后显示在文件列表上方 -->
    <div class="temp-reads" id="tempReads" hidden>
        <ul id="tempReadsList" hidden></ul>
    </div>

    <!-- 文件列表 -->
    <div class="file-list" id="fileList">
        <!-- 文件列表分批渲染，滑到底部由 sentinel 触发下一批 -->
        <ul></ul>
        <div id="loadMoreSentinel"></div>
    </div>

    <!-- 引入必要的库 -->
    <script>
        document.addEventListener('keydown', (event) => {
            if (event.shiftKey && event.metaKey && event.code === 'KeyO') {
                window.location.href = './';
            }
        });

        // 临时阅读：直接读取剪贴板内容，交给阅读页渲染（内容按 id 暂存、不记录进度）
        const CLIPBOARD_TEXT_KEY = '__clipboardText__';
        // 主页加载时，剪贴板里超过这个长度的文本会自动进入临时阅读
        const AUTO_CLIPBOARD_MIN_CHARS = 500;
        // 记录最近一次自动/手动打开过的剪贴板内容，避免从阅读页返回主页时反复跳转
        const AUTO_CLIPBOARD_SIGNATURE_KEY = '__clipboardAutoOpened__';

        function getClipboardSignature(text) {
            let hash = 2166136261;
            for (let i = 0; i < text.length; i++) {
                hash ^= text.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            return `${text.length}:${(hash >>> 0).toString(36)}`;
        }

        function rememberClipboardOpen(text) {
            try {
                localStorage.setItem(AUTO_CLIPBOARD_SIGNATURE_KEY, getClipboardSignature(text));
            } catch (error) {
                // localStorage 不可用时忽略，最多多跳转一次
            }
        }

        async function autoOpenClipboardReader() {
            if (!navigator.clipboard || typeof navigator.clipboard.readText !== 'function') return;

            let text = '';
            try {
                text = await navigator.clipboard.readText();
            } catch (error) {
                // 浏览器可能要求用户授权，自动读取失败时静默放弃
                console.log('自动读取剪贴板失败:', error);
                return;
            }

            if (!text || text.trim().length < AUTO_CLIPBOARD_MIN_CHARS) {
                // 剪贴板换成了普通内容，下次再复制长文本时可以重新自动打开
                try {
                    localStorage.removeItem(AUTO_CLIPBOARD_SIGNATURE_KEY);
                } catch (error) {
                    // 忽略
                }
                return;
            }

            const signature = getClipboardSignature(text);
            try {
                if (localStorage.getItem(AUTO_CLIPBOARD_SIGNATURE_KEY) === signature) {
                    return;
                }
            } catch (error) {
                // localStorage 不可用时继续尝试打开
            }

            try {
                sessionStorage.setItem(CLIPBOARD_TEXT_KEY, text);
            } catch (error) {
                console.warn('剪贴板内容过大，跳过自动临时阅读:', error);
                return;
            }

            rememberClipboardOpen(text);
            window.location.href = 'file.html?clipboard=1';
        }

        async function openClipboardReader() {
            let text = '';
            try {
                if (!navigator.clipboard || typeof navigator.clipboard.readText !== 'function') {
                    throw new Error('浏览器不支持 clipboard.readText');
                }
                text = await navigator.clipboard.readText();
            } catch (error) {
                console.warn('读取剪贴板失败，转入手动粘贴:', error);
            }

            if (text && text.trim()) {
                try {
                    sessionStorage.setItem(CLIPBOARD_TEXT_KEY, text);
                    rememberClipboardOpen(text);
                    window.location.href = 'file.html?clipboard=1';
                    return;
                } catch (error) {
                    console.error('保存剪贴板内容失败:', error);
                    alert('剪贴板内容过大，无法直接传递，请在阅读页手动粘贴');
                }
            }

            // 剪贴板为空或没有读取权限：打开阅读页的粘贴面板
            window.location.href = 'file.html?clipboard=1&paste=1';
        }

        document.getElementById('clipboardMode').addEventListener('click', openClipboardReader);

        // 服务器配置
        const SERVER_CONFIG = {
            progressOnly: false,
            remoteServerUrl: ''
        };

        // 获取服务器配置
        async function loadServerConfig() {
            try {
                const response = await fetch('/server-config');
                if (response.ok) {
                    const config = await response.json();
                    SERVER_CONFIG.progressOnly = config.progressOnly;
                    SERVER_CONFIG.remoteServerUrl = config.remoteServerUrl;
                    console.log('服务器配置:', SERVER_CONFIG);
                }
            } catch (error) {
                console.log('获取服务器配置失败，使用默认配置:', error);
            }
        }

        // HTML 转义函数，防止 XSS
        function escapeHtml(text) {
            if (typeof text !== 'string') return text;
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', async function() {
            // 只在根主页检查剪贴板：长文本自动进入临时阅读。
            // 进入子目录（?dir=...）时不要打断浏览。
            const currentDirParam = new URLSearchParams(window.location.search).get('dir');
            if (!currentDirParam) {
                autoOpenClipboardReader();
            }

            // 先获取服务器配置
            await loadServerConfig();

            // 如果是仅进度服务器模式，显示提示
            if (SERVER_CONFIG.progressOnly) {
                const fileListDiv = document.getElementById('fileList');
                fileListDiv.innerHTML = `
                    <div style="text-align: center; padding: 50px; color: #666;">
                        <h2>📚 仅进度服务器模式</h2>
                        <p>此服务器仅用于保存和同步阅读进度，不提供内容服务。</p>
                        ${SERVER_CONFIG.remoteServerUrl ? 
                            `<p>内容服务请访问：<a href="${SERVER_CONFIG.remoteServerUrl}">${SERVER_CONFIG.remoteServerUrl}</a></p>` : 
                            ''}
                    </div>
                `;
                return;
            }

            // 获取文件列表并显示
            const urlParams = new URLSearchParams(window.location.search);
            const dir = urlParams.get('dir') || ''; // 获取 `dir` 参数，如果不存在则为空字符串
            document.title = dir || 'txtReader';
            // fetch('/list-files')
            console.log('请求的文件夹：', dir); // 调试信息

            let allFiles = [];
            const currentDir = dir;

            // 排序偏好：name-asc / name-desc / time-asc / time-desc
            const SORT_OPTIONS = ['name-asc', 'name-desc', 'time-asc', 'time-desc'];

            function getSortPreference() {
                const saved = localStorage.getItem('sortMode');
                if (saved === 'name') return 'name-asc';
                if (saved === 'time') return 'time-desc';
                return SORT_OPTIONS.includes(saved) ? saved : 'time-desc';
            }

            let sortMode = getSortPreference();

            function compareFiles(a, b) {
                const [field, order] = sortMode.split('-');
                if (field === 'name') {
                    const aIsDir = !/\.(txt|md|epub)$/i.test(a.name);
                    const bIsDir = !/\.(txt|md|epub)$/i.test(b.name);
                    if (aIsDir !== bIsDir) return aIsDir ? -1 : 1;
                    const cmp = a.name.localeCompare(b.name, 'zh-CN', { numeric: true, sensitivity: 'base' });
                    return order === 'asc' ? cmp : -cmp;
                }
                return order === 'asc' ? a.mtime - b.mtime : b.mtime - a.mtime;
            }

            // 已读文件由服务器维护（跨设备统一），网络异常时退回本机记录
            let visitedFiles = new Set();

            async function loadVisitedFiles() {
                try {
                    const resp = await fetch('/read-files');
                    if (resp.ok) {
                        const data = await resp.json();
                        (data.readFiles || []).forEach(p => {
                            if (typeof p === 'string') visitedFiles.add(p);
                        });
                    }
                } catch (e) {
                    console.error('获取已读文件列表失败:', e);
                }
                // 兼容旧数据/离线：本机记录过的文件同样视为已读
                try {
                    JSON.parse(localStorage.getItem('visitedFiles') || '[]').forEach(p => visitedFiles.add(p));
                } catch (e) {}
            }

            function getFilePercent(filePath) {
                try {
                    const data = localStorage.getItem(`progress_${filePath}`);
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (parsed.percent !== undefined) {
                            return parsed.percent;
                        }
                    }
                } catch (e) {}
                return null;
            }

            const BATCH_SIZE = 50; // 一次渲染的条目数，滑到底部再渲染下一批
            let sortedFiles = [];  // 当前排序后的完整列表
            let renderedCount = 0; // 已渲染的条目数

            // 生成单条列表项的 HTML
            function buildFileItem(file) {
                const fileName = file.name;
                const moFileName = file.name.replace(/_/g, ' ').replace(/--/g, ' ').replace(/\.txt$/g, '').replace(/\.md$/g, '').replace(/\.epub$/i, '').replace(/——/g, ' ');
                const mtime = new Date(file.mtime).toLocaleString().replace(/,/g, ' '); // 格式化日期
                const fullPath = (currentDir && currentDir !== '' ? currentDir + '/' : '') + fileName;
                const isVisited = visitedFiles.has(fullPath);
                const percent = getFilePercent(fullPath);
                const visitedClass = isVisited ? 'visited' : '';
                const percentHtml = percent !== null ? `<span class="read-percent"> 已读 ${percent}%</span>` : '';
                if (fileName.toLowerCase().endsWith('.epub')) {
                    return `<li class="file epub ${visitedClass}"><a href="file.html?name=${encodeURIComponent(fullPath)}"><img src="web_icon/epub.svg" class='folder_icon'>${escapeHtml(moFileName)}</a><span class="mtime">${mtime}${percentHtml}</span></li>`;
                } else if (fileName.endsWith('.txt') || fileName.endsWith('.md')) {
                    return `<li class="file ${visitedClass}"><a href="file.html?name=${encodeURIComponent(fullPath)}">${escapeHtml(moFileName)}</a><span class="mtime">${mtime}${percentHtml}</span></li>`;
                }
                return `<li class="folder"><a href="index.html?dir=${encodeURIComponent(fullPath)}"><img src="web_icon/folder.svg" class='folder_icon'>${escapeHtml(moFileName)}</a><span class="mtime">${mtime}</span></li>`;
            }

            // 仅文件夹模式：非 epub 的文件隐藏
            function applyFoldersOnly(container) {
                container.querySelectorAll('li.file, li.folder').forEach(item => {
                    const visible = !foldersOnly || item.classList.contains('folder') || item.classList.contains('epub');
                    item.style.display = visible ? '' : 'none';
                });
            }

            // 渲染下一批（默认 50 条），返回本次渲染的条数
            function renderNextBatch() {
                const listEl = document.querySelector('#fileList ul');
                if (!listEl || renderedCount >= sortedFiles.length) return 0;

                const batch = sortedFiles.slice(renderedCount, renderedCount + BATCH_SIZE);
                const temp = document.createElement('ul');
                temp.innerHTML = batch.map(buildFileItem).join('');
                Array.from(temp.children).forEach(node => listEl.appendChild(node));
                renderedCount += batch.length;

                applyFoldersOnly(listEl);
                return batch.length;
            }

            // 视口附近还有空间就继续渲染，直到填满或全部渲染完
            function maybeLoadMore() {
                const sentinel = document.getElementById('loadMoreSentinel');
                if (!sentinel) return;
                while (renderedCount < sortedFiles.length &&
                       sentinel.getBoundingClientRect().top <= window.innerHeight + 400) {
                    if (renderNextBatch() === 0) break;
                }
            }

            function renderFileList() {
                sortedFiles = [...allFiles].sort(compareFiles);

                const listEl = document.querySelector('#fileList ul');
                listEl.innerHTML = '';
                renderedCount = 0;
                renderNextBatch();
                maybeLoadMore();
            }

            // 临时阅读：角落按钮显示条数，点击后展开文件列表上方的条目
            function bindTempReadsToggle() {
                const section = document.getElementById('tempReads');
                const toggle = document.getElementById('tempReadsToggle');
                const listEl = document.getElementById('tempReadsList');
                if (!section || !toggle || !listEl) return;

                toggle.addEventListener('click', () => {
                    const expanded = toggle.getAttribute('aria-expanded') !== 'true';
                    toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
                    section.classList.toggle('expanded', expanded);
                    listEl.hidden = !expanded;
                });
            }

            // 临时阅读列表：只显示在首页，条目链接到 file.html?tmp=<id>
            async function loadTempReads() {
                if (currentDir) return;
                const section = document.getElementById('tempReads');
                const toggle = document.getElementById('tempReadsToggle');
                const listEl = document.getElementById('tempReadsList');
                const countEl = document.getElementById('tempReadsCount');
                if (!section || !toggle || !listEl || !countEl) return;

                try {
                    const response = await fetch('/temp-read/list');
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    const data = await response.json();
                    const items = Array.isArray(data.items) ? data.items : [];
                    if (items.length === 0) {
                        section.hidden = true;
                        toggle.hidden = true;
                        return;
                    }

                    countEl.textContent = `${items.length}`;
                    toggle.title = `临时阅读：${items.length} 篇`;
                    listEl.innerHTML = items.map(item => {
                        const created = item.createdAt
                            ? new Date(item.createdAt).toLocaleString().replace(/,/g, ' ')
                            : '';
                        return `<li><a href="file.html?tmp=${encodeURIComponent(item.id)}">${escapeHtml(item.title || '临时阅读')}</a>${created ? `<span class="meta">${escapeHtml(created)}</span>` : ''}</li>`;
                    }).join('');
                    section.hidden = false;
                    toggle.hidden = false;
                } catch (error) {
                    console.warn('获取临时阅读列表失败:', error);
                    section.hidden = true;
                    toggle.hidden = true;
                }
            }

            // 滑到底部附近时渲染下一批
            const loadMoreSentinel = document.getElementById('loadMoreSentinel');
            if (loadMoreSentinel) {
                new IntersectionObserver(entries => {
                    if (entries.some(entry => entry.isIntersecting)) maybeLoadMore();
                }, { rootMargin: '400px 0px' }).observe(loadMoreSentinel);
            }
            // 兜底：IntersectionObserver 在后台标签页可能延迟回调，滚动时再判断一次
            window.addEventListener('scroll', () => {
                if (renderedCount < sortedFiles.length) maybeLoadMore();
            }, { passive: true });

            await loadVisitedFiles();
            bindTempReadsToggle();
            loadTempReads();

            fetch(`/list-files?dir=${encodeURIComponent(dir)}`)
                .then(async response => {
                    if (!response.ok) {
                        const message = await response.text();
                        throw new Error(message || `HTTP ${response.status}`);
                    }
                    return response.json();
                })
                .then(files => {
                    console.log('接收到的文件列表：', files); // 调试信息
                    allFiles = files;
                    renderFileList();
                })
                .catch(error => {
                    console.error('获取文件列表出错：', error);
                    const listEl = document.querySelector('#fileList ul');
                    const parentDir = currentDir.includes('/')
                        ? currentDir.slice(0, currentDir.lastIndexOf('/'))
                        : '';
                    const backLink = currentDir
                        ? `<a href="index.html${parentDir ? `?dir=${encodeURIComponent(parentDir)}` : ''}">返回上级</a>`
                        : '';
                    listEl.innerHTML = `<li>加载失败：${escapeHtml(error.message || '未知错误')}${backLink ? ' · ' + backLink : ''}</li>`;
                });

            const button = document.getElementById('toggleFoldersOnly');
            let foldersOnly = false;

            function toggleFoldersOnly() {
                foldersOnly = !foldersOnly;
                button.classList.toggle('active', foldersOnly);
                button.setAttribute('aria-pressed', foldersOnly ? 'true' : 'false');
                applyFoldersOnly(document.getElementById('fileList'));
                // 隐藏掉大半条目后视口可能又空出来了，继续补下一批
                maybeLoadMore();
            }

            button.addEventListener('click', () => {
                toggleFoldersOnly();
            });

            document.addEventListener('keydown', function(event) {
                if (event.shiftKey && event.metaKey && event.key.toLowerCase() === 'f') {
                    event.preventDefault();
                    toggleFoldersOnly();
                }
            });

            // 排序选单
            const sortButton = document.getElementById('toggleSortMode');
            const sortMenu = document.getElementById('sortMenu');

            function updateSortMenu() {
                sortMenu.querySelectorAll('[data-sort]').forEach(item => {
                    const active = item.dataset.sort === sortMode;
                    item.classList.toggle('active', active);
                    item.setAttribute('aria-checked', active ? 'true' : 'false');
                });
                const label = sortMenu.querySelector(`[data-sort="${sortMode}"]`).textContent;
                sortButton.title = `排序方式：${label}`;
            }

            function setSortMode(value) {
                if (!SORT_OPTIONS.includes(value)) return;
                sortMode = value;
                localStorage.setItem('sortMode', sortMode);
                updateSortMenu();
                renderFileList();
            }

            function toggleSortMenu(force) {
                const show = force !== undefined ? force : sortMenu.hidden;
                sortMenu.hidden = !show;
                sortButton.setAttribute('aria-expanded', show ? 'true' : 'false');
            }

            sortButton.addEventListener('click', (event) => {
                event.stopPropagation();
                toggleSortMenu();
            });

            sortMenu.addEventListener('click', (event) => {
                const item = event.target.closest('[data-sort]');
                if (!item) return;
                setSortMode(item.dataset.sort);
                toggleSortMenu(false);
            });

            document.addEventListener('click', (event) => {
                if (!sortMenu.hidden &&
                    !sortMenu.contains(event.target) &&
                    !sortButton.contains(event.target)) {
                    toggleSortMenu(false);
                }
            });

            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    toggleSortMenu(false);
                }
                if (event.shiftKey && event.metaKey && event.key.toLowerCase() === 's') {
                    event.preventDefault();
                    const next = SORT_OPTIONS[(SORT_OPTIONS.indexOf(sortMode) + 1) % SORT_OPTIONS.length];
                    setSortMode(next);
                }
            });

            updateSortMenu();

            // -------------------------------------------------------------
            // 最近阅读悬浮条（透明全宽，悬浮在页面最底部，点击继续阅读）
            // -------------------------------------------------------------
            // 从服务器获取最近阅读（跨设备统一，多个设备看到的是同一条）
            async function fetchLastRead() {
                try {
                    const resp = await fetch('/recent-reads?limit=1');
                    if (resp.ok) {
                        const data = await resp.json();
                        if (data.recentReads && data.recentReads.length > 0) {
                            return data.recentReads[0];
                        }
                    }
                } catch (e) {}
                return null;
            }

            // 兼容旧数据/离线：服务器没有记录时，取本机最近的一条
            function getLocalLastRead() {
                try {
                    const data = JSON.parse(localStorage.getItem('lastRead'));
                    if (data && data.path && typeof data.timestamp === 'number') {
                        return data;
                    }
                } catch (e) {}
                let best = null;
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (!key.startsWith('progress_')) continue;
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        if (data && typeof data.timestamp === 'number') {
                            if (!best || data.timestamp > best.timestamp) {
                                best = { path: key.slice('progress_'.length), timestamp: data.timestamp, percent: data.percent };
                            }
                        }
                    } catch (e) {}
                }
                return best;
            }

            // 格式化文件名（与列表页显示规则一致）
            function formatRecentName(path) {
                const base = path.split('/').pop() || path;
                return base.replace(/_/g, ' ').replace(/--/g, ' ').replace(/\.txt$/g, '').replace(/\.md$/g, '').replace(/\.epub$/i, '').replace(/——/g, ' ');
            }

            async function showLastReadBar() {
                let lastRead = await fetchLastRead();
                if (!lastRead) lastRead = getLocalLastRead();
                if (!lastRead) return;

                // 只显示文件名，超出 20 个字符则截断
                const MAX_NAME_LENGTH = 40;
                let name = formatRecentName(lastRead.path);
                const chars = Array.from(name);
                if (chars.length > MAX_NAME_LENGTH) {
                    name = chars.slice(0, MAX_NAME_LENGTH).join('') + '…';
                }

                const bar = document.createElement('div');
                bar.id = 'lastReadBar';
                bar.title = '点击继续阅读';
                bar.textContent = name;
                bar.addEventListener('click', () => {
                    window.location.href = 'file.html?name=' + encodeURIComponent(lastRead.path);
                });
                document.body.appendChild(bar);

                // 给文件列表底部留出空间，避免被悬浮条遮挡
                document.body.style.paddingBottom = '56px';
            }

            showLastReadBar();
        });


    </script>
    <script>
        // 注册 Service Worker
        if ('serviceWorker' in navigator) {
            const SW_CONTROLLED_KEY = '__swHasController__';
            const hasControlledBefore = () => {
                try {
                    return localStorage.getItem(SW_CONTROLLED_KEY) === '1';
                } catch (error) {
                    return false;
                }
            };
            const markControlled = () => {
                try {
                    localStorage.setItem(SW_CONTROLLED_KEY, '1');
                } catch (error) {
                    // localStorage 不可用时忽略
                }
            };

            const hadController = !!navigator.serviceWorker.controller;
            if (hadController) markControlled();

            let refreshing = false;
            // 新版本激活并接管页面后自动刷新一次，避免手动强制刷新。
            // 首次安装时 controller 从无到有，不需要刷新，只记录状态。
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                const controlledBefore = hadController || hasControlledBefore();
                markControlled();

                if (refreshing || !controlledBefore) return;
                refreshing = true;
                window.location.reload();
            });

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js', { updateViaCache: 'none' })
                    .then((registration) => {
                        console.log('Service Worker 注册成功:', registration.scope);
                        // 每次打开主页都主动检查更新
                        registration.update().catch(() => {});
                    })
                    .catch((error) => {
                        console.log('Service Worker 注册失败:', error);
                    });
            });
        }
    </script>
</body>
